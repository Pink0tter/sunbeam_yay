<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunbeam</title>
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <header>
        <h1>Choose Your Perfect Day:</h1><img src="https://sunbeam.hackclub.com/imgs/shark1.webp" width="250"><img src="https://sunbeam.hackclub.com/imgs/ray1.webp" width="250">
        <h4>Start by pressing your answer to the first question. To find the next question, scroll down, so do not scroll down too much at once! If it says to go to a certain number, scroll down until you see it.</h4>
    </header>
    <p>You woke up, now what do you do?</p>
    <ol>
        <li><button onclick="Getoutofbed()">Get out of bed</button></li>
        <li><button onclick="Gobacktosleep()">Go back to sleep</button></li>
    </ol>
    <p>Do you want breakfast?</p>
    <ol>
        <li><button onclick="Eatbreakfast()">Eat breakfast</button></li>
        <li><button onclick="Skipbreakfast()">Skip breakfast</button></li>
    </ol>
    <button onclick="clickButton()">Click me!</button>
    <img src="https://cdn.britannica.com/70/234870-050-D4D024BB/Orange-colored-cat-yawns-displaying-teeth.jpg" width="500">
</body>
<script src="script.js"></script>
</html>
